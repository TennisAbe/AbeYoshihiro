<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キャラクター一覧</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body><main>
  <header class="header">
    <div><h1>キャラクター管理</h1><p class="muted">キャラクターを選ぶと、専用の編集画面を開きます。</p></div>
    <a class="button" th:href="@{/characters/new}">＋ 新規登録</a>
  </header>
  <form class="search" th:action="@{/}" method="get" role="search">
    <input type="search" name="q" th:value="${query}" placeholder="キャラクター名で検索" aria-label="キャラクター名">
    <button type="submit">検索</button>
    <a th:if="${!#strings.isEmpty(query)}" th:href="@{/}">検索をクリア</a>
  </form>
  <p class="muted" th:text="${#lists.size(characters)} + '件のキャラクター'"></p>
  <section class="panel empty" th:if="${#lists.isEmpty(characters)}">
    <h2 th:text="${#strings.isEmpty(query) ? 'まだキャラクターがいません' : '該当するキャラクターが見つかりません'}"></h2>
    <p th:text="${#strings.isEmpty(query) ? '「新規登録」から最初のキャラクターを追加しましょう。' : '別の名前で検索するか、検索をクリアしてください。'}"></p>
  </section>
  <section class="grid" aria-label="キャラクター一覧">
    <a class="character-card" th:each="item : ${characters}"
       th:href="@{/characters/{id}/edit(id=${item.id})}">
      <div class="thumbnail">
        <img th:if="${item.imageRegistered}" th:src="@{/characters/{id}/image(id=${item.id})}" alt="" loading="lazy">
        <span th:unless="${item.imageRegistered}">画像未登録</span>
      </div>
      <h2 class="card-title" th:text="${item.name}"></h2>
    </a>
  </section>
</main></body>
</html>
