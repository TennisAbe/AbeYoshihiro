<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOCTALITH | キャラクター一覧</title>
  <link rel="icon" type="image/png" th:href="@{/images/noctalith-mark.png}">
  <link rel="stylesheet" th:href="@{/style.css}">
  <script th:src="@{/palace.js}" defer></script>
  <script th:src="@{/favorites.js}" defer></script>
  <script th:src="@{/card-colors.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/palace :: atmosphere}"></div>
<div class="page-shell">
<header th:replace="~{fragments/palace :: masthead}"></header>
<main id="main-content">
  <p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p>
  <p class="field-error" role="alert" th:if="${error}" th:text="${error}"></p>
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-copy" data-reveal>
      <p class="eyebrow"><span></span> THE CHARACTER COLLECTION</p>
      <h1 id="page-title">物語を宿す、<br><em>魂の記録。</em></h1>
      <p class="hero-description">姿、個性、そして秘めた物語。<br>あなただけのキャラクターを、この宮殿に。</p>
      <a class="button" th:href="@{/characters/new}"><span aria-hidden="true">＋</span> 新規登録 <span aria-hidden="true">↗</span></a>
    </div>
    <div class="hero-art" aria-hidden="true"><div class="seal-ring ring-outer"></div><div class="seal-ring ring-inner"></div><div class="seal-diamond"></div><span class="seal-star">✧</span><span class="seal-caption">EVERY SOUL HAS A STORY</span></div>
    <div class="hero-number" aria-hidden="true">01 <span>/ COLLECTION</span></div>
  </section>
  <p class="protagonist-add"><a class="button secondary" th:href="@{/protagonists/new}">＋ 主人公を追加</a></p>
  <div class="section-heading" data-reveal><div><p class="eyebrow">THE ARCHIVE</p><h2>キャラクター名鑑</h2></div>
    <p class="collection-count"><strong th:text="${#lists.size(characters)}">0</strong><span>CHARACTERS</span></p>
  </div>
  <p class="classification-guide"><a th:href="@{/affiliations/order}">所属の表示順を設定</a><span class="muted">世界と所属の順番を優先し、並び替えは同じ所属の中で適用します。</span></p>
  <form class="search" data-reveal th:action="@{/}" method="get" role="search">
    <input type="search" name="q" th:value="${query}" placeholder="キャラクター名で検索" aria-label="キャラクター名">
    <select name="tag" aria-label="タグで絞り込み">
      <option value="">すべてのタグ</option>
      <option th:if="${!#strings.isEmpty(selectedTag) and !#lists.contains(tags, selectedTag)}"
              th:value="${selectedTag}" th:text="${selectedTag}" selected></option>
      <option th:each="tag : ${tags}" th:value="${tag}" th:text="${tag}" th:selected="${tag == selectedTag}"></option>
    </select>
    <select name="sort" aria-label="並び順">
      <option value="oldest" th:selected="${sort == 'oldest'}">登録順（古い順）</option>
      <option value="newest" th:selected="${sort == 'newest'}">登録順（新しい順）</option>
      <option value="name" th:selected="${sort == 'name'}">名前順</option>
      <option value="favorite" th:selected="${sort == 'favorite'}">お気に入り優先</option>
    </select>
    <label class="checkbox-label"><input type="checkbox" name="favorites" value="true" th:checked="${favorites}"> お気に入りのみ</label>
    <button type="submit">検索</button>
    <a th:if="${!#strings.isEmpty(query) or !#strings.isEmpty(selectedTag) or favorites or sort != 'oldest'}" th:href="@{/}">検索をクリア</a>
  </form>

  <section class="panel empty" data-reveal th:if="${#lists.isEmpty(characters)}">
    <h2 th:text="${#strings.isEmpty(query) and #strings.isEmpty(selectedTag) and !favorites ? 'まだキャラクターがいません' : '該当するキャラクターが見つかりません'}"></h2>
    <p th:text="${#strings.isEmpty(query) and #strings.isEmpty(selectedTag) and !favorites ? '「新規登録」から最初のキャラクターを追加しましょう。' : '名前・タグ・お気に入り条件を変更するか、検索をクリアしてください。'}"></p>
  </section>
  <section class="world-section" th:each="group : ${worldGroups}" th:attr="data-world=${group.world}">
    <header class="world-heading"><h2 th:text="${group.world.name() == 'PROTAGONIST' ? '主人公' : group.world.label + 'の人物'}"></h2><span class="muted" th:text="${#lists.size(group.characters)} + '人'"></span></header>
    <p class="muted world-empty" th:if="${#lists.isEmpty(group.characters)}">表示する人物はいません。</p>
  <div class="grid" th:attr="aria-label=${group.world.name() == 'PROTAGONIST' ? '主人公' : group.world.label + 'の人物'}">
    <article class="character-card" data-reveal th:each="item : ${group.characters}" th:classappend="${item.cardColor != null ? 'has-custom-color' : ''}" th:style="${'--card-index: ' + itemStat.index + ';' + (item.cardRgb != null ? '--card-rgb: ' + item.cardRgb + ';' : '')}">
    <a class="card-link" th:href="@{/characters/{id}(id=${item.id})}" th:attr="aria-label=${item.name + 'の詳細を見る'}">
      <div class="thumbnail">
        <img th:if="${item.imageRegistered}" th:src="@{/characters/{id}/image(id=${item.id})}" alt="" loading="lazy">
        <span class="portrait-placeholder" th:unless="${item.imageRegistered}"><b aria-hidden="true">✧</b><span>画像未登録</span></span>
      </div>
    </a>
      <div class="card-meta"><span th:text="'NO. ' + ${#numbers.formatInteger(group.offset + itemStat.count, 3)}"></span><div class="card-shortcuts">
        <a class="card-action card-view" th:href="@{/characters/{id}(id=${item.id})}" title="詳細を見る" th:attr="aria-label=${item.name + 'の詳細を見る'}"><span aria-hidden="true">↗</span></a>
        <a class="card-action card-edit" th:href="@{/characters/{id}/edit(id=${item.id})}" title="編集する" th:attr="aria-label=${item.name + 'を編集する'}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16 3 5 5-12 12-6 2 2-6Z"/><path d="m14 5 5 5"/></svg></a>
      </div></div>
    <a class="card-title-link" th:href="@{/characters/{id}(id=${item.id})}">
      <h2 class="card-title" th:text="${item.name}"></h2>
      <p class="card-affiliation" th:unless="${item.protagonist}"><span>所属</span><span th:text="${#strings.isEmpty(item.affiliation) ? '未所属' : item.affiliation}"></span></p>
    </a>
    <div class="tags" th:if="${!#sets.isEmpty(item.tags)}" aria-label="タグ">
      <a class="tag" th:each="tag : ${item.tags}" th:text="${tag}"
         th:href="@{/(q=${query},tag=${tag},sort=${sort},favorites=${favorites})}"></a>
    </div>
    <form class="favorite-form" th:action="@{/characters/{id}/favorite(id=${item.id})}" method="post">
      <input type="hidden" name="q" th:value="${query}"><input type="hidden" name="tag" th:value="${selectedTag}">
      <input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="favorites" th:value="${favorites}">
      <button type="submit" class="favorite-button" th:classappend="${item.favorite ? 'is-favorite' : ''}" th:attr="aria-pressed=${item.favorite}" th:text="${item.favorite ? '★ お気に入り解除' : '☆ お気に入り'}"></button>
    </form>
    <details class="card-color-editor"><summary>背景色を設定</summary>
      <form class="card-color-form" th:action="@{/characters/{id}/card-color(id=${item.id})}" method="post" th:attr="data-saved-color=${item.cardColor ?: ''}">
        <p class="muted">RGBでグラデーションの色を選べます。</p>
        <label>色を選択<input type="color" class="color-picker" th:value="${item.cardColor ?: '#33213e'}"></label>
        <div class="rgb-fields"><label>R<input type="number" name="red" min="0" max="255" step="1" required th:value="${item.cardRed}"></label><label>G<input type="number" name="green" min="0" max="255" step="1" required th:value="${item.cardGreen}"></label><label>B<input type="number" name="blue" min="0" max="255" step="1" required th:value="${item.cardBlue}"></label></div>
        <input type="hidden" name="q" th:value="${query}"><input type="hidden" name="tag" th:value="${selectedTag}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="favorites" th:value="${favorites}">
        <div class="color-actions"><button type="submit">色を保存</button><button type="submit" name="reset" value="true" formnovalidate>標準に戻す</button></div>
        <p class="color-status" role="status" aria-live="polite"></p>
      </form>
    </details>
    </article>
  </div>
  </section>
</main>
<footer th:replace="~{fragments/palace :: footer}"></footer>
</div>
</body>
</html>
