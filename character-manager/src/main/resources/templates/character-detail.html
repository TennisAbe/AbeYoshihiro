<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${'NOCTALITH | ' + character.name}"></title><link rel="icon" type="image/png" th:href="@{/images/noctalith-mark.png}"><link rel="stylesheet" th:href="@{/style.css}"><script th:src="@{/palace.js}" defer></script></head>
<body><div th:replace="~{fragments/palace :: atmosphere}"></div><div class="page-shell"><header th:replace="~{fragments/palace :: masthead}"></header><main>
<p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p><p class="field-error" role="alert" th:if="${error}" th:text="${error}"></p>
<header class="dossier-header" data-reveal><p class="eyebrow">THE PERSONAL DOSSIER</p><h1 th:text="${character.name}"></h1>
<div class="dossier-meta"><span>世界 <b th:text="${character.world.label}"></b></span><span>所属 <b th:text="${#strings.isEmpty(character.affiliation) ? '未所属' : character.affiliation}"></b></span></div>
<div class="actions"><a class="button" th:href="@{/characters/{id}/edit(id=${character.id})}">プロフィールを編集</a><a href="#history">修正履歴</a><a th:href="@{/}">一覧に戻る</a></div></header>
<div class="dossier-layout"><aside class="dossier-portrait" data-reveal><div class="portrait-frame"><img th:if="${character.imageRegistered}" th:src="@{/characters/{id}/image(id=${character.id})}" th:alt="${character.name + 'の画像'}"><div class="portrait-placeholder" th:unless="${character.imageRegistered}"><b aria-hidden="true">✧</b><span>画像未登録</span></div></div>
<div class="tags dossier-tags" th:if="${!#sets.isEmpty(character.tags)}"><a class="tag" th:each="tag : ${character.tags}" th:href="@{/(tag=${tag})}" th:text="${tag}"></a></div>
<div class="dossier-gallery" th:if="${!#lists.isEmpty(pictures)}"><a th:each="picture : ${pictures}" th:href="@{/characters/{id}/images/{pictureId}(id=${character.id},pictureId=${picture.id})}" target="_blank" rel="noopener"><img th:src="@{/characters/{id}/images/{pictureId}(id=${character.id},pictureId=${picture.id})}" th:alt="${#strings.isEmpty(picture.title) ? 'キャラクター画像' : picture.title}" loading="lazy"></a></div></aside>
<article class="dossier-content"><section class="dossier-section" th:each="section : ${profileSections}" data-reveal><header><span class="dossier-section-number" th:text="${#numbers.formatInteger(sectionStat.count, 2)}"></span><h2 th:text="${section.label}"></h2></header><p class="dossier-copy" th:classappend="${#strings.isEmpty(section.currentValue) ? 'is-empty' : ''}" th:text="${#strings.isEmpty(section.currentValue) ? '未設定' : section.currentValue}"></p></section></article></div>
<section class="panel dossier-connections" data-reveal><p class="eyebrow">CONNECTIONS</p><h2>キャラクター同士の関係</h2><p class="muted" th:if="${#lists.isEmpty(outgoing) and #lists.isEmpty(incoming)}">関係はまだ登録されていません。</p>
<article class="relation-item" th:each="relation : ${outgoing}"><h3>→ <a th:href="@{/characters/{id}(id=${relation.target.id})}" th:text="${relation.target.name}"></a> <span th:text="${relation.relationType}"></span></h3><p class="dossier-copy" th:text="${relation.description}"></p></article>
<article class="relation-item" th:each="relation : ${incoming}"><h3><a th:href="@{/characters/{id}(id=${relation.source.id})}" th:text="${relation.source.name}"></a> → <span th:text="${relation.relationType}"></span></h3><p class="dossier-copy" th:text="${relation.description}"></p></article></section>
<section class="panel history-panel" id="history" data-reveal><p class="eyebrow">REVISION ARCHIVE</p><h2>修正履歴</h2><p class="muted">更新前のプロフィールを最大3件保存します。日時は変更した時刻（日本時間）です。復元前の状態も履歴に残ります。画像・関係・お気に入りは復元対象外です。</p><p class="muted" th:if="${#lists.isEmpty(history)}">修正履歴はまだありません。</p>
<article class="history-entry" th:each="entry : ${history}"><header><time th:datetime="${entry.revision.savedAt}" th:text="${entry.revision.timestamp + ' JST'}"></time><span class="muted" th:text="${entry.revision.reasonLabel}"></span></header><p class="muted" th:if="${#lists.isEmpty(entry.differences)}">現在と同じ内容です。</p>
<details th:unless="${#lists.isEmpty(entry.differences)}"><summary th:text="${'現在との差分：' + #lists.size(entry.differences) + '項目'}"></summary><div th:replace="~{fragments/revision-diff :: differences(${entry.differences})}"></div></details>
<a class="button secondary" th:href="@{/characters/{id}/history/{revisionId}(id=${character.id},revisionId=${entry.revision.id})}">差分を確認して復元</a></article></section>
<nav class="character-pagination" aria-label="キャラクターの前後移動" th:if="${hasCharacterNavigation}">
  <a class="character-page-link nav-previous" th:if="${previousCharacter != null}" th:href="@{/characters/{id}(id=${previousCharacter.id})}" rel="prev"><span class="page-direction"><span aria-hidden="true">←</span> 前のキャラクター</span><strong th:text="${previousCharacter.name}"></strong></a>
  <div class="character-page-position"><span th:text="${navigationPosition + ' / ' + navigationTotal}"></span><a th:href="@{/}">一覧へ戻る</a></div>
  <a class="character-page-link nav-next" th:if="${nextCharacter != null}" th:href="@{/characters/{id}(id=${nextCharacter.id})}" rel="next"><span class="page-direction">次のキャラクター <span aria-hidden="true">→</span></span><strong th:text="${nextCharacter.name}"></strong></a>
</nav>
</main><footer th:replace="~{fragments/palace :: footer}"></footer></div></body></html>
