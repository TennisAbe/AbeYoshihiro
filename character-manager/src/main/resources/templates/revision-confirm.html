<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOCTALITH | 履歴からの復元確認</title><link rel="icon" type="image/png" th:href="@{/images/noctalith-mark.png}"><link rel="stylesheet" th:href="@{/style.css}"><script th:src="@{/palace.js}" defer></script></head>
<body><div th:replace="~{fragments/palace :: atmosphere}"></div><div class="page-shell"><header th:replace="~{fragments/palace :: masthead}"></header><main>
<header class="editor-header"><div><p class="eyebrow">RESTORE CONFIRMATION</p><h1>履歴からの復元確認</h1></div><a class="button secondary" th:href="@{/characters/{id}(id=${character.id})} + '#history'">履歴へ戻る</a></header>
<p class="field-error" role="alert" th:if="${error}" th:text="${error}"></p><section class="panel history-panel"><h2 th:text="${character.name}"></h2><p><time th:text="${revision.timestamp + ' JST'}"></time> <span th:text="${revision.reasonLabel}"></span></p><p class="muted">変更される項目だけを表示しています。「履歴の内容」に戻します。現在のプロフィールは復元前の履歴として保存します。画像・関係・お気に入りは変更しません。</p>
<div th:replace="~{fragments/revision-diff :: differences(${differences})}"></div><p th:if="${#lists.isEmpty(differences)}">現在と同じ内容のため、復元する必要はありません。</p>
<form th:if="${!#lists.isEmpty(differences)}" th:action="@{/characters/{id}/history/{revisionId}/restore(id=${character.id},revisionId=${revision.id})}" method="post" onsubmit="return confirm('表示された履歴の内容にプロフィールを戻しますか？');"><input type="hidden" name="fingerprint" th:value="${fingerprint}"><label class="checkbox-label"><input type="checkbox" name="confirmed" value="true" required> 現在との差分を確認し、この履歴の内容に戻します</label><div class="actions"><button type="submit">この履歴に戻す</button><a th:href="@{/characters/{id}(id=${character.id})} + '#history'">キャンセル</a></div></form>
</section></main><footer th:replace="~{fragments/palace :: footer}"></footer></div></body></html>
